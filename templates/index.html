<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Advik's AI Coach</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
        }


        .header {
            background: #2563eb;
            color: white;
            padding: 24px;
            text-align: center;
        }


        .header h1 {
            margin: 0;
            font-size: 28px;
        }


        .header p {
            margin: 8px 0 0;
            font-size: 15px;
        }


        .container {
            max-width: 760px;
            margin: 26px auto;
            padding: 0 16px;
        }


        .card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }


        .controls {
            padding: 20px;
            border-bottom: 1px solid #e5e7eb;
        }


        .controls label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }


        .event-select {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            background: white;
        }


        .chat-area {
            height: 445px;
            overflow-y: auto;
            padding: 20px;
            background: #f8fafc;
        }


        .message {
            margin-bottom: 16px;
            display: flex;
        }


        .message.user {
            justify-content: flex-end;
        }


        .message-content {
            max-width: 82%;
            padding: 13px 15px;
            border-radius: 12px;
            line-height: 1.55;
            white-space: pre-wrap;
        }


        .message.assistant .message-content {
            background: #dbeafe;
            color: #173b8f;
        }


        .message.user .message-content {
            background: #2563eb;
            color: white;
        }


        .input-area {
            padding: 18px;
            border-top: 1px solid #e5e7eb;
            background: white;
        }


        textarea {
            width: 100%;
            min-height: 80px;
            resize: vertical;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            font-family: inherit;
            font-size: 15px;
            outline: none;
        }


        textarea:focus {
            border-color: #2563eb;
        }


        .button-row {
            display: flex;
            justify-content: flex-end;
            margin-top: 12px;
        }


        button {
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 9px;
            padding: 11px 20px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }


        button:hover {
            background: #1d4ed8;
        }


        button:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }


        .status {
            margin-top: 8px;
            font-size: 13px;
            color: #64748b;
            min-height: 18px;
        }


        .typing {
            color: #64748b;
            font-style: italic;
        }


        @media (max-width: 600px) {

            .header h1 {
                font-size: 24px;
            }

            .chat-area {
                height: 400px;
            }

            .message-content {
                max-width: 90%;
            }

        }

    </style>

</head>


<body>


    <div class="header">

        <h1>🤖 Advik's AI Coach</h1>

        <p>Your Science Olympiad learning assistant</p>

    </div>


    <div class="container">

        <div class="card">


            <div class="controls">

                <label for="eventSelect">
                    Select Event
                </label>

                <select id="eventSelect"
                        class="event-select">

                    <option value="remote-sensing">
                        Remote Sensing
                    </option>

                    <option value="thermodynamics" disabled>
                        Thermodynamics — Coming Soon
                    </option>

                    <option value="hovercraft" disabled>
                        Hovercraft — Coming Soon
                    </option>

                </select>

            </div>


            <div id="chatArea"
                 class="chat-area">

                <div class="message assistant">

                    <div class="message-content">
                        Hi Advik! I'm your AI Coach.

                        Ask me anything about Remote Sensing. I can explain concepts, help with calculations, give you practice questions, and help you understand mistakes.
                    </div>

                </div>

            </div>


            <div class="input-area">

                <textarea
                    id="questionInput"
                    placeholder="Example: What is spatial resolution?"></textarea>


                <div class="button-row">

                    <button id="askButton">
                        Ask AI
                    </button>

                </div>


                <div id="status"
                     class="status"></div>

            </div>


        </div>

    </div>


<script>


    const questionInput =
        document.getElementById("questionInput");


    const askButton =
        document.getElementById("askButton");


    const chatArea =
        document.getElementById("chatArea");


    const status =
        document.getElementById("status");


    const eventSelect =
        document.getElementById("eventSelect");


    // Stores the conversation in the browser.
    //
    // The current question is not added here
    // until after the server successfully answers it.
    //
    // This prevents the newest question from being
    // sent twice to the backend.

    let conversationHistory = [];


    function escapeHtml(text) {

        const div =
            document.createElement("div");

        div.textContent = text;

        return div.innerHTML;
    }


    function addMessage(role, content) {

        const message =
            document.createElement("div");

        message.className =
            "message " + role;


        const messageContent =
            document.createElement("div");

        messageContent.className =
            "message-content";


        messageContent.innerHTML =
            escapeHtml(content);


        message.appendChild(messageContent);

        chatArea.appendChild(message);


        chatArea.scrollTop =
            chatArea.scrollHeight;
    }


    function showTyping() {

        const message =
            document.createElement("div");

        message.id =
            "typingMessage";

        message.className =
            "message assistant";


        message.innerHTML = `
            <div class="message-content typing">
                Thinking...
            </div>
        `;


        chatArea.appendChild(message);

        chatArea.scrollTop =
            chatArea.scrollHeight;
    }


    function removeTyping() {

        const typingMessage =
            document.getElementById("typingMessage");


        if (typingMessage) {

            typingMessage.remove();

        }
    }


    async function askAI() {

        const question =
            questionInput.value.trim();


        if (!question) {

            status.textContent =
                "Please enter a question.";

            return;
        }


        const currentQuestion =
            question;


        addMessage(
            "user",
            currentQuestion
        );


        questionInput.value = "";

        askButton.disabled = true;

        status.textContent =
            "AI Coach is thinking...";


        showTyping();


        try {

            const response =
                await fetch("/api/chat", {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        question:
                            currentQuestion,

                        history:
                            conversationHistory

                    })

                });


            const data =
                await response.json();


            removeTyping();


            if (!response.ok) {

                throw new Error(
                    data.error ||
                    "Something went wrong."
                );

            }


            const answer =
                data.answer ||
                "I could not generate an answer.";


            addMessage(
                "assistant",
                answer
            );


            // Store both messages only after
            // the AI successfully responds.

            conversationHistory.push({

                role: "user",

                content: currentQuestion

            });


            conversationHistory.push({

                role: "assistant",

                content: answer

            });


            // Keep the browser history from growing
            // indefinitely.
            //
            // 20 messages = approximately
            // 10 question/answer exchanges.

            if (conversationHistory.length > 20) {

                conversationHistory =
                    conversationHistory.slice(-20);

            }


            status.textContent = "";


        } catch (error) {

            removeTyping();


            addMessage(
                "assistant",
                "Sorry, I couldn't connect to the AI Coach.\n\n" +
                error.message
            );


            status.textContent =
                "There was a connection error.";

        }


        askButton.disabled = false;

        questionInput.focus();

    }


    askButton.addEventListener(
        "click",
        askAI
    );


    questionInput.addEventListener(
        "keydown",
        function(event) {

            // Cmd + Enter on Mac
            // Ctrl + Enter on Windows

            if (
                event.key === "Enter" &&
                (event.metaKey || event.ctrlKey)
            ) {

                event.preventDefault();

                askAI();

            }

        }
    );


    eventSelect.addEventListener(
        "change",
        function() {

            const selectedEvent =
                eventSelect.value;


            if (
                selectedEvent ===
                "remote-sensing"
            ) {

                status.textContent =
                    "Remote Sensing AI Coach is ready.";

            }

        }
    );


</script>


</body>

</html>
