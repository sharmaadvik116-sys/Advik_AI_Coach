<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Advik's AI Coach</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
        }

        .header {
            background: #2563eb;
            color: white;
            padding: 24px;
            text-align: center;
        }

        .header h1 {
            margin: 0;
            font-size: 28px;
        }

        .header p {
            margin: 8px 0 0;
            font-size: 15px;
            opacity: 0.95;
        }

        .container {
            max-width: 850px;
            margin: 30px auto;
            padding: 0 16px;
        }

        .coach-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }

        .controls {
            padding: 20px;
            border-bottom: 1px solid #e5e7eb;
        }

        .controls label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 16px;
            background: white;
        }

        .chat-area {
            height: 500px;
            overflow-y: auto;
            padding: 20px;
            background: #f8fafc;
        }

        .message {
            margin-bottom: 16px;
            display: flex;
        }

        .message.user {
            justify-content: flex-end;
        }

        .message.coach {
            justify-content: flex-start;
        }

        .bubble {
            max-width: 80%;
            padding: 13px 16px;
            border-radius: 14px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .coach .bubble {
            background: #e0ecff;
            color: #1e3a8a;
            border-bottom-left-radius: 4px;
        }

        .user .bubble {
            background: #2563eb;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .input-area {
            padding: 20px;
            border-top: 1px solid #e5e7eb;
            background: white;
        }

        textarea {
            width: 100%;
            min-height: 90px;
            resize: vertical;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-family: inherit;
            font-size: 16px;
            outline: none;
        }

        textarea:focus {
            border-color: #2563eb;
        }

        .button-row {
            display: flex;
            justify-content: flex-end;
            margin-top: 12px;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        .status {
            margin-top: 10px;
            font-size: 14px;
            color: #64748b;
            min-height: 20px;
        }

        @media (max-width: 600px) {

            .header h1 {
                font-size: 23px;
            }

            .chat-area {
                height: 450px;
            }

            .bubble {
                max-width: 90%;
            }

        }

    </style>
</head>


<body>

    <div class="header">

        <h1>🤖 Advik's AI Coach</h1>

        <p>Your Science Olympiad learning assistant</p>

    </div>


    <div class="container">

        <div class="coach-card">


            <!-- Event Selection -->

            <div class="controls">

                <label for="event">
                    Select Event
                </label>

                <select id="event">

                    <option value="remote_sensing">
                        Remote Sensing
                    </option>

                    <option value="thermodynamics">
                        Thermodynamics
                    </option>

                    <option value="hovercraft">
                        Hovercraft
                    </option>

                </select>

            </div>


            <!-- Chat Messages -->

            <div
                id="chatArea"
                class="chat-area"
            >

                <div class="message coach">

                    <div class="bubble">
                        Hi Advik! I'm your AI Coach.

                        Ask me anything about Remote Sensing. I can explain concepts, help with calculations, give you practice questions, and help you understand why an answer is correct or incorrect.
                    </div>

                </div>

            </div>


            <!-- Question Input -->

            <div class="input-area">

                <textarea
                    id="question"
                    placeholder="Example: What is spatial resolution?"
                ></textarea>


                <div class="button-row">

                    <button
                        id="askButton"
                        onclick="askAI()"
                    >
                        Ask AI
                    </button>

                </div>


                <div
                    id="status"
                    class="status"
                ></div>

            </div>

        </div>

    </div>


    <script>

        /*
         * Conversation history
         *
         * This stores the previous messages in the browser.
         *
         * IMPORTANT:
         * The current question is sent separately.
         * After the AI answers, both messages are added
         * to the conversation history.
         */

        let conversationHistory = [];


        /*
         * Add a message to the chat window.
         */

        function addMessage(role, text) {

            const chatArea = document.getElementById("chatArea");

            const messageDiv = document.createElement("div");

            messageDiv.className =
                role === "user"
                    ? "message user"
                    : "message coach";


            const bubble = document.createElement("div");

            bubble.className = "bubble";

            /*
             * textContent prevents HTML entered by the user
             * or returned by the AI from being interpreted
             * as webpage code.
             */

            bubble.textContent = text;


            messageDiv.appendChild(bubble);

            chatArea.appendChild(messageDiv);


            /*
             * Automatically scroll to the newest message.
             */

            chatArea.scrollTop = chatArea.scrollHeight;

        }


        /*
         * Send the student's question to the backend.
         */

        async function askAI() {

            const questionBox =
                document.getElementById("question");

            const askButton =
                document.getElementById("askButton");

            const status =
                document.getElementById("status");


            const question =
                questionBox.value.trim();


            /*
             * Do nothing if the student has not entered
             * a question.
             */

            if (!question) {

                status.textContent =
                    "Please enter a question.";

                return;

            }


            /*
             * Show the student's question immediately.
             */

            addMessage("user", question);


            /*
             * Clear the input box.
             */

            questionBox.value = "";


            /*
             * Disable the button while waiting.
             */

            askButton.disabled = true;

            askButton.textContent = "Thinking...";

            status.textContent = "AI Coach is thinking...";


            try {

                /*
                 * Send the previous conversation history
                 * PLUS the newest question.
                 *
                 * The backend will add the newest question
                 * to the API conversation.
                 */

                const response = await fetch(
                    "/api/chat",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({

                            question: question,

                            history: conversationHistory

                        })

                    }
                );


                const data = await response.json();


                /*
                 * If the backend returned an error,
                 * display it.
                 */

                if (!response.ok) {

                    throw new Error(
                        data.error ||
                        "Something went wrong."
                    );

                }


                /*
                 * Display the AI answer.
                 */

                addMessage(
                    "coach",
                    data.answer
                );


                /*
                 * NOW save the current question and
                 * AI answer into browser conversation history.
                 *
                 * This happens AFTER the request because
                 * the backend already adds the current
                 * question to the API input.
                 */

                conversationHistory.push({

                    role: "user",

                    content: question

                });


                conversationHistory.push({

                    role: "assistant",

                    content: data.answer

                });


                status.textContent = "";


            } catch (error) {

                console.error(error);


                addMessage(
                    "coach",
                    "Sorry, I couldn't get an answer right now. Please check that the AI Coach server is running."
                );


                status.textContent =
                    "There was a problem connecting to the AI Coach.";

            }


            /*
             * Enable the button again.
             */

            askButton.disabled = false;

            askButton.textContent = "Ask AI";

        }


        /*
         * Allow Cmd + Enter on Mac
         * or Ctrl + Enter on Windows
         * to submit the question.
         */

        document
            .getElementById("question")
            .addEventListener(
                "keydown",
                function(event) {

                    if (
                        event.key === "Enter" &&
                        (event.metaKey || event.ctrlKey)
                    ) {

                        event.preventDefault();

                        askAI();

                    }

                }
            );

    </script>

</body>

</html>
